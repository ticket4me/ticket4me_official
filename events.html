<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket4Me — Events</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a; --white: #f5f2ee; --accent: #e8441a; --accent2: #f5a623;
    --gray: #6b6560; --card-bg: #141414; --border: rgba(245,242,238,0.1);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(10,10,10,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--white); text-decoration: none; }
  .logo span { color: var(--accent); }
  .nav-right { display: flex; gap: 24px; align-items: center; }
  .nav-link { color: var(--gray); text-decoration: none; font-size: 14px; transition: color 0.2s; }
  .nav-link:hover { color: var(--white); }
  .nav-btn { background: var(--accent); color: var(--white); border: none; padding: 10px 22px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.2s; }
  .nav-btn:hover { background: #c93a16; }

  /* HERO */
  .hero { padding: 140px 48px 60px; text-align: center; position: relative; overflow: hidden; }
  .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(245,242,238,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(245,242,238,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
  .hero-glow { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(232,68,26,0.12) 0%, transparent 70%); top: 0; left: 50%; transform: translateX(-50%); pointer-events: none; }
  .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 8vw, 90px); line-height: 1; letter-spacing: 2px; margin-bottom: 16px; position: relative; }
  .hero h1 em { color: var(--accent); font-style: normal; }
  .hero p { font-size: 16px; color: var(--gray); margin-bottom: 40px; position: relative; }

  /* FILTERS */
  .filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; position: relative; }
  .filter-btn { background: none; border: 1px solid var(--border); color: var(--gray); padding: 8px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { border-color: rgba(245,242,238,0.3); color: var(--white); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--white); }

  /* SEARCH */
  .search-wrap { display: flex; justify-content: center; margin-bottom: 0; position: relative; }
  .search-input { background: var(--card-bg); border: 1px solid var(--border); color: var(--white); padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; max-width: 400px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--gray); }

  /* MAIN */
  .main { padding: 48px; max-width: 1200px; margin: 0 auto; }

  /* STATS BAR */
  .stats-bar { display: flex; gap: 32px; margin-bottom: 40px; flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--gray); }
  .stat strong { color: var(--white); font-weight: 500; }

  /* EVENTS GRID */
  .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2px; background: var(--border); }
  
  /* EVENT CARD */
  .event-card { background: var(--card-bg); position: relative; overflow: hidden; cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; }
  .event-card:hover { background: #1c1c1c; }
  .event-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.3s; }
  .event-card:hover::before { transform: scaleX(1); }
  .event-img { width: 100%; height: 200px; object-fit: cover; display: block; background: #1a1a1a; }
  .event-img-placeholder { width: 100%; height: 200px; background: linear-gradient(135deg, #1a1a1a, #222); display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .event-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
  .event-category { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 10px; display: block; }
  .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; margin-bottom: 8px; line-height: 1.1; }
  .event-venue { font-size: 13px; color: var(--gray); margin-bottom: 16px; }
  .event-meta { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .event-meta-item { font-size: 12px; color: rgba(245,242,238,0.5); display: flex; align-items: center; gap: 6px; }
  .event-meta-item span { font-size: 14px; }
  .event-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .event-price { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--accent2); }
  .event-price small { font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; display: block; font-weight: 400; }
  .tickets-left { font-size: 12px; color: var(--gray); }
  .tickets-left.low { color: #ff8a6a; }
  .buy-btn { background: var(--accent); color: var(--white); border: none; padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
  .buy-btn:hover { background: #c93a16; }

  /* EMPTY STATE */
  .empty-state { grid-column: 1/-1; text-align: center; padding: 100px 40px; }
  .empty-state .icon { font-size: 48px; margin-bottom: 20px; display: block; }
  .empty-state h3 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; color: var(--gray); max-width: 400px; margin: 0 auto; line-height: 1.7; }

  /* LOADING */
  .loading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2px; background: var(--border); }
  .skeleton { background: var(--card-bg); height: 380px; position: relative; overflow: hidden; }
  .skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(245,242,238,0.04), transparent); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* REALTIME BADGE */
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--green, #22c55e); border: 1px solid rgba(34,197,94,0.3); padding: 4px 12px; margin-bottom: 32px; position: relative; }
  .live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* FOOTER */
  footer { border-top: 1px solid var(--border); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-top: 80px; }
  footer p { font-size: 13px; color: var(--gray); }
  .footer-links { display: flex; gap: 28px; }
  .footer-links a { font-size: 13px; color: var(--gray); text-decoration: none; transition: color 0.2s; }
  .footer-links a:hover { color: var(--white); }

  @media (max-width: 768px) {
    nav { padding: 16px 24px; }
    .hero { padding: 100px 24px 40px; }
    .main { padding: 24px; }
    .events-grid { grid-template-columns: 1fr; }
    footer { padding: 32px 24px; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">T4<span>M</span></a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Home</a>
    <a href="events.html" class="nav-link" style="color:var(--white)">Events</a>
    <a href="index.html#join" class="nav-btn">Get tickets</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="live-badge"><div class="live-dot"></div>Live updates</div>
  <h1>Find your next<br><em>live experience</em></h1>
  <p>Browse events from verified venues across the US</p>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All events</button>
    <button class="filter-btn" onclick="setFilter('Concert hall', this)">Concerts</button>
    <button class="filter-btn" onclick="setFilter('Club / bar', this)">Club & Bar</button>
    <button class="filter-btn" onclick="setFilter('Theatre', this)">Theatre</button>
    <button class="filter-btn" onclick="setFilter('Outdoor / festival', this)">Festivals</button>
    <button class="filter-btn" onclick="setFilter('Sports arena', this)">Sports</button>
    <button class="filter-btn" onclick="setFilter('Other', this)">Other</button>
  </div>
  <div class="search-wrap" style="margin-top:16px;">
    <input type="text" class="search-input" id="search" placeholder="Search events, venues, cities..." oninput="renderEvents()">
  </div>
</div>

<div class="main">
  <div class="stats-bar" id="stats-bar" style="display:none;">
    <div class="stat"><strong id="stat-count">0</strong> events</div>
    <div class="stat"><strong id="stat-venues">0</strong> venues</div>
  </div>
  <div id="events-container">
    <div class="loading-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</div>

<footer>
  <a href="index.html" class="logo" style="font-size:22px;">T4<span>M</span></a>
  <p>© 2025 Ticket4Me. All rights reserved.</p>
  <div class="footer-links">
    <a href="#">Terms</a>
    <a href="#">Privacy</a>
    <a href="#">Contact</a>
  </div>
</footer>

<script>
  const SUPABASE_URL = 'https://zpfpgzwhltijokiawuhg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZnBnendobHRpam9raWF3dWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Njk0MzYsImV4cCI6MjA5NTA0NTQzNn0.Hbq2wT0d26OmgGyP8is34NWzTa7m9JtDUcNL2lL-xUg';
  let sb;
  let allEvents = [];
  let currentFilter = 'all';

  const categoryEmoji = {
    'Concert hall': '🎵', 'Club / bar': '🎧', 'Theatre': '🎭',
    'Outdoor / festival': '🎪', 'Sports arena': '🏟', 'Open house / pop-up': '🎉', 'Other': '✨'
  };

  window.addEventListener('load', async () => {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadEvents();

    // Realtime updates — auto refresh when venues are approved or events added
    sb.channel('public:events')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => loadEvents())
      .subscribe();
    sb.channel('public:venues')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'venues' }, () => loadEvents())
      .subscribe();
  });

  async function loadEvents() {
    const { data, error } = await sb
      .from('events')
      .select('*, venues(venue_name, venue_type, status)')
      .eq('status', 'on_sale')
      .order('date', { ascending: true });

    if (error) { console.error(error); return; }

    // Only show events from approved venues
    allEvents = (data || []).filter(e => e.venues && e.venues.status === 'active');
    renderEvents();
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEvents();
  }

  function renderEvents() {
    const search = document.getElementById('search').value.toLowerCase();
    let filtered = allEvents;

    if (currentFilter !== 'all') {
      filtered = filtered.filter(e => e.venues && e.venues.venue_type === currentFilter);
    }

    if (search) {
      filtered = filtered.filter(e =>
        e.name.toLowerCase().includes(search) ||
        (e.city || '').toLowerCase().includes(search) ||
        (e.venues && e.venues.venue_name.toLowerCase().includes(search))
      );
    }

    // Update stats
    const uniqueVenues = new Set(filtered.map(e => e.venue_id)).size;
    document.getElementById('stat-count').textContent = filtered.length;
    document.getElementById('stat-venues').textContent = uniqueVenues;
    document.getElementById('stats-bar').style.display = filtered.length > 0 ? 'flex' : 'none';

    const container = document.getElementById('events-container');

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="events-grid">
          <div class="empty-state">
            <span class="icon">🎟</span>
            <h3>${allEvents.length === 0 ? 'No events yet' : 'No matches found'}</h3>
            <p>${allEvents.length === 0
              ? 'Events will appear here as soon as venues are approved and list their shows. Check back soon!'
              : 'Try a different search or filter.'}</p>
          </div>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="events-grid">${filtered.map(eventCard).join('')}</div>`;
  }

  function eventCard(e) {
    const ticketsLeft = e.total_tickets - e.tickets_sold;
    const isLow = ticketsLeft < 20;
    const date = new Date(e.date);
    const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const emoji = categoryEmoji[e.venues?.venue_type] || '🎵';
    const price = e.ticket_price === 0 ? 'Free' : '$' + Number(e.ticket_price).toFixed(2);

    return `
      <div class="event-card">
        ${e.image_url
          ? `<img class="event-img" src="${e.image_url}" alt="${e.name}" onerror="this.style.display='none'">`
          : `<div class="event-img-placeholder">${emoji}</div>`}
        <div class="event-body">
          <span class="event-category">${e.category || e.venues?.venue_type || 'Event'}</span>
          <div class="event-name">${e.name}</div>
          <div class="event-venue">@ ${e.venues?.venue_name || 'Unknown venue'}</div>
          <div class="event-meta">
            <div class="event-meta-item"><span>📅</span>${dateStr}</div>
            <div class="event-meta-item"><span>🕐</span>${timeStr}</div>
            ${e.city ? `<div class="event-meta-item"><span>📍</span>${e.city}</div>` : ''}
          </div>
          ${e.description ? `<p style="font-size:13px; color:var(--gray); line-height:1.6; margin-bottom:16px;">${e.description.slice(0, 100)}${e.description.length > 100 ? '...' : ''}</p>` : ''}
          <div class="event-footer">
            <div class="event-price">
              ${price}
              <small>per ticket</small>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
              <div class="tickets-left ${isLow ? 'low' : ''}">${isLow ? '🔥 ' : ''}${ticketsLeft} left</div>
              <button class="buy-btn" onclick="buyTicket('${e.id}')">Get tickets →</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function buyTicket(eventId) {
    // Will connect to checkout flow later
    alert('Checkout coming soon! Event ID: ' + eventId);
  }
</script>
</body>
</html>
