<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T4M — My Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a; --white: #f5f2ee; --accent: #e8441a; --accent2: #f5a623;
    --gray: #6b6560; --card-bg: #141414; --border: rgba(245,242,238,0.1);
    --green: #22c55e;
  }
  body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  /* AUTH */
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-box { background: var(--card-bg); border: 1px solid var(--border); padding: 48px; width: 100%; max-width: 420px; }
  .auth-logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; display: block; }
  .auth-logo span { color: var(--accent); }
  .auth-sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); margin-bottom: 36px; display: block; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 8px; font-weight: 500; }
  .form-group input { width: 100%; background: #0a0a0a; border: 1px solid var(--border); color: var(--white); padding: 13px 16px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: rgba(245,242,238,0.2); }
  .btn { width: 100%; background: var(--accent); color: var(--white); border: none; padding: 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
  .btn:hover { background: #c93a16; }
  .btn:disabled { background: #444; cursor: not-allowed; }
  .alert { padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
  .alert.error { background: rgba(232,68,26,0.15); border: 1px solid rgba(232,68,26,0.4); color: #ff8a6a; }
  .auth-switch { font-size: 13px; color: var(--gray); text-align: center; margin-top: 20px; }
  .auth-switch a { color: var(--accent); }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(10,10,10,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--white); text-decoration: none; }
  .logo span { color: var(--accent); }
  .nav-right { display: flex; gap: 20px; align-items: center; }
  .nav-link { color: var(--gray); text-decoration: none; font-size: 14px; transition: color 0.2s; }
  .nav-link:hover { color: var(--white); }
  .nav-btn { background: var(--accent); color: var(--white); border: none; padding: 9px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.2s; }
  .nav-btn:hover { background: #c93a16; }
  .signout-link { color: var(--gray); font-size: 13px; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
  .signout-link:hover { color: var(--white); }

  /* APP */
  .app { display: none; padding-top: 80px; min-height: 100vh; }
  .app.show { display: block; }

  /* HERO STRIP */
  .user-hero { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
  .user-hero-left h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 1px; margin-bottom: 4px; }
  .user-hero-left h1 em { color: var(--accent); font-style: normal; }
  .user-hero-left p { font-size: 14px; color: var(--gray); }
  .user-hero-right { display: flex; gap: 32px; }
  .hero-stat { text-align: center; }
  .hero-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; color: var(--accent2); display: block; }
  .hero-stat-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }

  /* VENUE OWNER BANNER */
  .venue-banner { background: rgba(232,68,26,0.08); border-bottom: 1px solid rgba(232,68,26,0.2); padding: 12px 48px; display: none; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .venue-banner.show { display: flex; }
  .venue-banner p { font-size: 13px; color: rgba(245,242,238,0.7); }
  .venue-banner p strong { color: var(--white); }
  .venue-banner a { color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 500; }
  .venue-banner a:hover { text-decoration: underline; }

  /* MAIN */
  .main { padding: 48px; max-width: 1100px; margin: 0 auto; }

  /* TABS */
  .tabs { display: flex; gap: 2px; background: var(--border); padding: 2px; margin-bottom: 32px; width: fit-content; }
  .tab { padding: 10px 24px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; background: none; color: var(--gray); transition: all 0.2s; }
  .tab.active { background: var(--card-bg); color: var(--white); }

  /* TICKETS GRID */
  .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background: var(--border); }

  /* TICKET CARD */
  .ticket-card { background: var(--card-bg); padding: 28px; position: relative; overflow: hidden; }
  .ticket-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: var(--accent); }
  .ticket-card.past::before { background: var(--gray); }
  .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .ticket-event { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; line-height: 1.1; max-width: 200px; }
  .ticket-badge { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid; }
  .ticket-badge.upcoming { color: var(--green); border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.08); }
  .ticket-badge.past { color: var(--gray); border-color: var(--border); }
  .ticket-meta { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .ticket-meta-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray); }
  .ticket-meta-row span { font-size: 15px; }
  .ticket-divider { border: none; border-top: 1px dashed rgba(245,242,238,0.1); margin: 20px 0; }
  .ticket-footer { display: flex; align-items: center; justify-content: space-between; }
  .ticket-id { font-size: 10px; letter-spacing: 2px; color: rgba(107,101,96,0.6); font-family: monospace; }
  .ticket-price { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent2); }
  .qr-btn { background: none; border: 1px solid var(--border); color: var(--gray); padding: 6px 12px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
  .qr-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* EMPTY */
  .empty-state { text-align: center; padding: 80px 40px; grid-column: 1/-1; }
  .empty-state .icon { font-size: 48px; margin-bottom: 20px; display: block; }
  .empty-state h3 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; color: var(--gray); max-width: 360px; margin: 0 auto 28px; line-height: 1.7; }

  /* QR MODAL */
  .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(10,10,10,0.95); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 360px; padding: 40px; transform: translateY(20px); transition: transform 0.25s; position: relative; text-align: center; }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--gray); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: var(--white); }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--gray); margin-bottom: 28px; }
  .qr-display { width: 200px; height: 200px; background: white; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .qr-display canvas { display: block; }
  .qr-timer { font-size: 12px; color: var(--gray); margin-bottom: 20px; }
  .qr-timer span { color: var(--accent); font-weight: 500; }
  .ticket-holder { font-size: 13px; color: var(--gray); }
  .ticket-holder strong { color: var(--white); display: block; font-size: 15px; }

  /* FOOTER */
  footer { border-top: 1px solid var(--border); padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: 60px; }
  footer p { font-size: 13px; color: var(--gray); }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a { font-size: 13px; color: var(--gray); text-decoration: none; }
  .footer-links a:hover { color: var(--white); }

  @media (max-width: 768px) {
    nav { padding: 16px 24px; }
    .user-hero { padding: 28px 24px; }
    .venue-banner { padding: 12px 24px; }
    .main { padding: 24px; }
    .tickets-grid { grid-template-columns: 1fr; }
    footer { padding: 24px; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <span class="auth-logo">T4<span>M</span></span>
    <span class="auth-sub">My tickets</span>
    <div class="alert error" id="auth-error" style="display:none;"></div>
    <div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="you@email.com"></div>
    <div class="form-group"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()"></div>
    <button class="btn" id="login-btn" onclick="login()">Sign in →</button>
    <div class="auth-switch">No account? <a href="index.html">Sign up on T4M</a></div>
  </div>
</div>

<!-- NAV -->
<nav id="main-nav" style="display:none;">
  <a href="index.html" class="logo">T4<span>M</span></a>
  <div class="nav-right">
    <a href="events.html" class="nav-link">Browse events</a>
    <span id="nav-user" style="font-size:13px; color:var(--gray);"></span>
    <button class="signout-link" onclick="signOut()">Sign out</button>
  </div>
</nav>

<!-- APP -->
<div class="app" id="app">
  <!-- VENUE OWNER BANNER -->
  <div class="venue-banner" id="venue-banner">
    <p>You also own <strong id="venue-count">a venue</strong> on T4M.</p>
    <a href="venue-dashboard.html">Go to venue dashboard →</a>
  </div>

  <!-- USER HERO -->
  <div class="user-hero">
    <div class="user-hero-left">
      <h1>Hey, <em id="user-first-name">there</em></h1>
      <p id="user-email-display"></p>
    </div>
    <div class="user-hero-right">
      <div class="hero-stat">
        <span class="hero-stat-val" id="total-tickets">0</span>
        <span class="hero-stat-label">Tickets</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val" id="upcoming-count">0</span>
        <span class="hero-stat-label">Upcoming</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val" id="total-spent">$0</span>
        <span class="hero-stat-label">Spent</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab active" onclick="setTab('upcoming', this)">Upcoming</button>
      <button class="tab" onclick="setTab('past', this)">Past</button>
      <button class="tab" onclick="setTab('all', this)">All tickets</button>
    </div>
    <div class="tickets-grid" id="tickets-grid">
      <div class="empty-state" style="background:var(--card-bg); padding:80px 40px;">
        <span class="icon">⏳</span>
        <h3>Loading tickets...</h3>
      </div>
    </div>
  </div>
</div>

<footer>
  <a href="index.html" class="logo" style="font-size:20px;">T4<span>M</span></a>
  <p>© 2025 Ticket4Me.</p>
  <div class="footer-links">
    <a href="events.html">Browse events</a>
    <a href="#">Support</a>
  </div>
</footer>

<!-- QR MODAL -->
<div class="modal-overlay" id="qr-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeQR()">✕</button>
    <div class="modal-title" id="qr-event-name">Event</div>
    <div class="modal-sub" id="qr-event-date"></div>
    <div class="qr-display" id="qr-display">
      <svg width="160" height="160" viewBox="0 0 160 160" id="qr-svg"></svg>
    </div>
    <div class="qr-timer">Refreshes in <span id="qr-countdown">30</span>s</div>
    <div class="ticket-holder">
      <strong id="qr-holder-name"></strong>
      Ticket holder
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zpfpgzwhltijokiawuhg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZnBnendobHRpam9raWF3dWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Njk0MzYsImV4cCI6MjA5NTA0NTQzNn0.Hbq2wT0d26OmgGyP8is34NWzTa7m9JtDUcNL2lL-xUg';
let sb, currentUser, allTickets = [], currentTab = 'upcoming';
let qrInterval, qrCountdown = 30, activeTicket = null;

window.addEventListener('load', async () => {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) {
    currentUser = data.session.user;
    showApp();
  }
});

async function login() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  const btn = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { err.textContent = error.message; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign in →'; return; }
  currentUser = data.user;
  showApp();
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

async function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-nav').style.display = 'flex';
  document.getElementById('app').classList.add('show');

  const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
  const firstName = name.split(' ')[0];
  document.getElementById('user-first-name').textContent = firstName;
  document.getElementById('user-email-display').textContent = currentUser.email;
  document.getElementById('nav-user').textContent = firstName;

  // Check if they also own venues
  const { data: venues } = await sb.from('venues').select('id, venue_name').eq('owner_id', currentUser.id);
  if (venues && venues.length > 0) {
    const banner = document.getElementById('venue-banner');
    banner.classList.add('show');
    document.getElementById('venue-count').textContent = venues.length === 1 ? `"${venues[0].venue_name}"` : `${venues.length} venues`;
  }

  await loadTickets();
}

async function loadTickets() {
  const { data, error } = await sb
    .from('ticket_sales')
    .select('*, events(name, date, city, location, ticket_price, venues(venue_name))')
    .eq('user_id', currentUser.id)
    .order('sold_at', { ascending: false });

  allTickets = data || [];

  const upcoming = allTickets.filter(t => t.events && new Date(t.events.date) >= new Date());
  const totalSpent = allTickets.reduce((a, t) => a + (t.price_paid * t.quantity), 0);

  document.getElementById('total-tickets').textContent = allTickets.length;
  document.getElementById('upcoming-count').textContent = upcoming.length;
  document.getElementById('total-spent').textContent = '$' + totalSpent.toFixed(0);

  renderTickets();
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTickets();
}

function renderTickets() {
  const now = new Date();
  let filtered = allTickets;
  if (currentTab === 'upcoming') filtered = allTickets.filter(t => t.events && new Date(t.events.date) >= now);
  if (currentTab === 'past') filtered = allTickets.filter(t => t.events && new Date(t.events.date) < now);

  const grid = document.getElementById('tickets-grid');

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="background:var(--card-bg); padding:80px 40px;">
        <span class="icon">🎟</span>
        <h3>${currentTab === 'upcoming' ? 'No upcoming events' : currentTab === 'past' ? 'No past events' : 'No tickets yet'}</h3>
        <p>${currentTab === 'upcoming' ? "You don't have any upcoming events. Browse events and grab some tickets!" : currentTab === 'past' ? "You haven't attended any events yet." : "You haven't bought any tickets yet."}</p>
        <a href="events.html" style="display:inline-block; background:var(--accent); color:var(--white); padding:12px 28px; text-decoration:none; font-size:14px; font-weight:500;">Browse events →</a>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(ticketCard).join('');
}

function ticketCard(t) {
  if (!t.events) return '';
  const isPast = new Date(t.events.date) < new Date();
  const date = new Date(t.events.date);
  const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
  const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const shortId = t.id.split('-')[0].toUpperCase();

  return `
    <div class="ticket-card ${isPast ? 'past' : ''}">
      <div class="ticket-top">
        <div class="ticket-event">${t.events.name}</div>
        <span class="ticket-badge ${isPast ? 'past' : 'upcoming'}">${isPast ? 'Past' : 'Upcoming'}</span>
      </div>
      <div class="ticket-meta">
        <div class="ticket-meta-row"><span>🏟</span>${t.events.venues?.venue_name || 'Unknown venue'}</div>
        <div class="ticket-meta-row"><span>📅</span>${dateStr}</div>
        <div class="ticket-meta-row"><span>🕐</span>${timeStr}</div>
        ${t.events.city ? `<div class="ticket-meta-row"><span>📍</span>${t.events.city}</div>` : ''}
        <div class="ticket-meta-row"><span>🎟</span>${t.quantity} ticket${t.quantity > 1 ? 's' : ''}</div>
      </div>
      <hr class="ticket-divider">
      <div class="ticket-footer">
        <div>
          <div class="ticket-price">$${(t.price_paid * t.quantity).toFixed(2)}</div>
          <div class="ticket-id">#${shortId}</div>
        </div>
        ${!isPast ? `<button class="qr-btn" onclick="showQR('${t.id}', '${t.events.name.replace(/'/g, "\\'")}', '${dateStr}')">Show QR →</button>` : '<span style="font-size:12px;color:var(--gray);">Event ended</span>'}
      </div>
    </div>`;
}

// QR CODE — simple visual QR placeholder with rotating token
function showQR(ticketId, eventName, eventDate) {
  activeTicket = ticketId;
  document.getElementById('qr-event-name').textContent = eventName;
  document.getElementById('qr-event-date').textContent = eventDate;
  document.getElementById('qr-holder-name').textContent = currentUser.user_metadata?.full_name || currentUser.email;
  document.getElementById('qr-modal').classList.add('active');
  generateQR(ticketId);
  startQRTimer(ticketId);
}

function generateQR(ticketId) {
  const token = ticketId + '_' + Math.floor(Date.now() / 30000);
  const svg = document.getElementById('qr-svg');
  // Simple visual QR pattern based on token hash
  let hash = 0;
  for (let i = 0; i < token.length; i++) hash = ((hash << 5) - hash) + token.charCodeAt(i);
  hash = Math.abs(hash);
  const size = 10;
  const cellSize = 14;
  let cells = '';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const bit = (hash >> ((r * size + c) % 32)) & 1;
      const isCorner = (r < 3 && c < 3) || (r < 3 && c >= size-3) || (r >= size-3 && c < 3);
      if (bit || isCorner) {
        cells += `<rect x="${c*cellSize+5}" y="${r*cellSize+5}" width="${cellSize-1}" height="${cellSize-1}" fill="${isCorner ? '#e8441a' : '#0a0a0a'}"/>`;
      }
    }
  }
  svg.innerHTML = `<rect width="160" height="160" fill="white"/>${cells}`;
}

function startQRTimer(ticketId) {
  if (qrInterval) clearInterval(qrInterval);
  qrCountdown = 30;
  document.getElementById('qr-countdown').textContent = qrCountdown;
  qrInterval = setInterval(() => {
    qrCountdown--;
    document.getElementById('qr-countdown').textContent = qrCountdown;
    if (qrCountdown <= 0) {
      qrCountdown = 30;
      generateQR(ticketId);
    }
  }, 1000);
}

function closeQR() {
  document.getElementById('qr-modal').classList.remove('active');
  if (qrInterval) clearInterval(qrInterval);
  activeTicket = null;
}

document.getElementById('qr-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('qr-modal')) closeQR();
});
</script>
</body>
</html>
